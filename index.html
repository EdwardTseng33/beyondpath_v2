  /* === BP_AppShell === */

  .bp-shell-menu-roles-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .bp-shell-menu-role { position:relative; display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid rgba(255,255,255,0.08); background:#0c0c10; border-radius:7px; cursor:pointer; color:#9a9aa3; transition:all .15s; }

  .bp-shell-body { flex:1 1 auto; min-height:0; overflow:hidden; display:flex; }
  .bp-shell-body > * { flex:1; min-width:0; }
  .bp-journey-root { width:100%; height:100%; display:flex; flex-direction:column; background:#0a0a0b; color:#e8e8ea; font-family:'Inter','PingFang TC',sans-serif; position:relative; }
  .bp-jtrack { flex:0 0 auto; padding:8px 14px 10px; background:#08080a; border-bottom:1px solid rgba(255,255,255,0.06); }

  .bp-jtrack-hide { margin-left:auto; background:transparent; border:1px solid rgba(255,255,255,0.1); color:#9a9aa3; padding:3px 8px; border-radius:4px; cursor:pointer; font:500 10px/1 'JetBrains Mono','SF Mono',monospace; }

  /* === Tier ladder === */
  .bp-tier-ladder { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:14px; margin-top:14px; }

  .bp-tier-step .row2 { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-top:12px; min-width:0; }
  .bp-tier-step .tzh { font:600 13px/1.1 'PingFang TC',sans-serif; color:#e8e8ea; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .bp-tier-step .tcrit { font:500 10px/1 'JetBrains Mono','SF Mono',monospace; color:#7a7a82; flex:0 0 auto; padding:2px 6px; border-radius:3px; background:rgba(255,255,255,0.04); }
  .bp-tier-step .row3 { font:400 11px/1.55 'PingFang TC','Inter',sans-serif; color:#b0b0b8; min-height:34px; margin-top:10px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .bp-tier-step .state { position:absolute; top:14px; right:14px; font:700 9px/1 'JetBrains Mono','SF Mono',monospace; color:var(--tcol); letter-spacing:0.14em; text-transform:uppercase; padding:5px 9px;x; border-radius:3px; background:color-mix(in oklab, var(--tcol) 14%, transparent); border:1px solid color-mix(in oklab, var(--tcol) 35%, transparent); }
  .bp-tier-step .state.next { color:#9a9aa3; background:rgba(255,255,255,0.04); border-color:rgba(255,255,255,0.1); }
  .bp-tier-step.current { background:color-mix(in oklab, var(--tcol) 22%, transparent); border-color:var(--tcol); box-shadow:0 0 0 2px var(--tcol), 0 14px 36px color-mix(in oklab, var(--tcol) 32%, transparent); transform:translateY(-3px); }
  .bp-tier-step.current::before { opacity:1; height:4px; }
  .bp-tier-step.next { border-style:dashed; }
  @media (max-width: 1380px) {
    .bp-tier-ladder { grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px; }
  }

  /* === Tier picker (Step 03) === */
  .bp-tier-pick { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:6px; }
  .bp-tier-pick-card { position:relative; display:flex; flex-direction:column; gap:8px; padding:10px 9px; border-radius:8px; border:1px solid rgba(255,255,255,0.08); background:#0c0c10; color:#9a9aa3; cursor:pointer; transition:all .15s; min-width:0; text-align:left; overflow:hidden; }

  /* deliverables picker (Step 03) */

  .bp-deliv {
    display:flex; align-items:center; gap:12px;
