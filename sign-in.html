<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in · BeyondPath</title>
<meta name="description" content="使用 Google 帳號登入 BeyondPath" />
<link rel="canonical" href="https://beyondpath.tw/sign-in.html" />
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#0a0a0b" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://beyondpath.tw/sign-in.html" />
<meta property="og:title" content="Sign in · BeyondPath" />
<meta property="og:description" content="使用 Google 帳號登入 BeyondPath" />
<meta property="og:image" content="https://beyondpath.tw/assets/og-beyondpath.png" />
<meta property="og:site_name" content="BeyondPath" />
<meta property="og:locale" content="zh_TW" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://beyondpath.tw/assets/og-beyondpath.png" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="components/styles.css">

<style>
  :root {
    --bg: #0a0a0b;
    --bg-1: rgba(255,255,255,0.025);
    --line: rgba(255,255,255,0.08);
    --line-soft: rgba(255,255,255,0.04);
    --text: #f0eee8;
    --text-2: #c8c6c0;
    --muted: #9a9aa3;
    --accent: #c7e84a;
    --accent-line: rgba(199,232,74,0.4);
    --accent-soft: rgba(199,232,74,0.08);
    --accent-dim: oklch(0.78 0.10 230);
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
    --zh: 'Noto Sans TC', 'PingFang TC', sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }

  .si-root { min-height: 100vh; display: flex; flex-direction: column; }

  /* Top bar · brand only */
  .si-top { padding: 18px 32px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 14px; }
  .si-top .mark { width: 16px; height: 16px; border-radius: 4px; background: linear-gradient(135deg, var(--accent), oklch(0.72 0.14 100)); }
  .si-top .name { font: 700 14px/1 var(--sans); letter-spacing: 0.04em; }
  .si-top .name .accent { color: var(--accent); }
  .si-top small { font: 500 10px/1 var(--mono); color: var(--muted); letter-spacing: 0.18em; padding-left: 12px; border-left: 1px solid var(--line); }

  /* Main */
  .si-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; position: relative; }

  /* Background ambient mesh */
  .si-mesh { position: absolute; inset: 0; pointer-events: none; opacity: 0.18; }
  .si-mesh circle { fill: var(--accent); }
  .si-mesh line { stroke: var(--accent); stroke-width: 0.5; opacity: 0.4; }

  /* Card */
  .si-card { width: 100%; max-width: 440px; padding: 40px 36px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; position: relative; z-index: 1; box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
  .si-eyebrow { font: 700 10px/1 var(--mono); letter-spacing: 0.22em; color: var(--accent); text-transform: uppercase; margin-bottom: 16px; }
  .si-h { font: 700 28px/1.2 var(--zh); letter-spacing: -0.02em; margin: 0 0 8px; color: var(--text); }
  .si-sub { font: 400 14px/1.6 var(--zh); color: var(--muted); margin: 0 0 28px; }

  /* Provider buttons */
  .si-providers { display: flex; flex-direction: column; gap: 10px; }
  .si-btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 14px 18px; background: transparent; border: 1px solid var(--text-2); border-radius: 4px; cursor: pointer; font: 600 14px/1 var(--sans); color: var(--text); transition: border-color 160ms, background 160ms, color 160ms; text-decoration: none; }
  .si-btn:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .si-btn .g-logo { width: 18px; height: 18px; }
  .si-btn .arr { margin-left: auto; opacity: 0.5; font-size: 14px; }

  /* Divider */
  .si-divider { display: flex; align-items: center; gap: 12px; margin: 18px 0; font: 600 10px/1 var(--mono); letter-spacing: 0.22em; color: var(--muted); text-transform: uppercase; }
  .si-divider::before, .si-divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  /* Email form */
  .si-email-form { display: flex; flex-direction: column; gap: 10px; }
  .si-input { width: 100%; padding: 13px 14px; background: var(--bg-1); border: 1px solid var(--line); border-radius: 4px; font: 400 14px/1.4 var(--sans); color: var(--text); outline: none; transition: border-color 160ms; }
  .si-input:focus { border-color: var(--accent); }
  .si-input::placeholder { color: var(--muted); }
  .si-cta-primary { background: var(--accent); color: var(--bg); border: 0; padding: 14px 18px; font: 700 13px/1 var(--mono); letter-spacing: 0.1em; cursor: pointer; border-radius: 4px; transition: filter 160ms; }
  .si-cta-primary:hover { filter: brightness(1.08); }

  /* Footer */
  .si-foot { font: 500 11px/1.6 var(--mono); letter-spacing: 0.06em; color: var(--muted); margin-top: 28px; padding-top: 20px; border-top: 1px dashed var(--line); }
  .si-foot a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-line); }

  .si-bottom { padding: 16px 32px; border-top: 1px solid var(--line-soft); font: 500 10px/1.6 var(--mono); letter-spacing: 0.08em; color: var(--muted); display: flex; justify-content: space-between; }
  .si-bottom a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--line); }
  .si-bottom a:hover { color: var(--accent); border-bottom-color: var(--accent); }

  /* Loading state */
  .si-loading { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 40px 0; }
  .si-spinner { width: 44px; height: 44px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: siSpin 0.9s linear infinite; }
  @keyframes siSpin { to { transform: rotate(360deg); } }
  .si-loading-text { font: 600 12px/1.4 var(--mono); letter-spacing: 0.16em; color: var(--accent); text-transform: uppercase; }
  .si-loading-sub { font: 400 13px/1.4 var(--zh); color: var(--muted); }

  /* Prototype banner */
  .si-disclaimer { background: rgba(255,200,80,0.08); border: 1px solid rgba(255,200,80,0.25); padding: 10px 14px; border-radius: 4px; margin-bottom: 24px; display: flex; gap: 10px; align-items: start; }
  .si-disclaimer .icon { color: oklch(0.85 0.18 75); font-size: 14px; }
  .si-disclaimer .text { font: 500 11px/1.6 var(--zh); color: var(--text-2); }
  .si-disclaimer .text b { color: oklch(0.85 0.18 75); font-weight: 700; }

  @media (max-width: 600px) {
    .si-card { padding: 32px 24px; }
    .si-h { font-size: 22px; }
    .si-top { padding: 14px 20px; }
    .si-bottom { padding: 14px 20px; flex-direction: column; gap: 6px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="components/supabase.js?v=0.1.0"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

function AmbientMesh() {
  const points = React.useMemo(() => {
    const p = [];
    for (let i = 0; i < 24; i++) {
      p.push({
        cx: Math.random() * 100,
        cy: Math.random() * 100,
        r: 1.2 + Math.random() * 1.5,
      });
    }
    return p;
  }, []);
  const lines = React.useMemo(() => {
    const ls = [];
    for (let i = 0; i < points.length; i++) {
      for (let j = i + 1; j < points.length; j++) {
        const dx = points[i].cx - points[j].cx;
        const dy = points[i].cy - points[j].cy;
        if (Math.hypot(dx, dy) < 22) {
          ls.push({ a: points[i], b: points[j] });
        }
      }
    }
    return ls;
  }, [points]);
  return (
    <svg className="si-mesh" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      {lines.map((l, i) => (
        <line key={i} x1={l.a.cx} y1={l.a.cy} x2={l.b.cx} y2={l.b.cy} />
      ))}
      {points.map((p, i) => (
        <circle key={i} cx={p.cx} cy={p.cy} r={p.r} />
      ))}
    </svg>
  );
}

function GoogleLogo() {
  return (
    <svg className="g-logo" viewBox="0 0 18 18" aria-hidden="true">
      <path fill="#4285F4" d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.614z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
      <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
      <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
    </svg>
  );
}

function getRoleFromQuery() {
  try {
    const qs = new URLSearchParams(window.location.search);
    const role = qs.get("role");
    if (role === "client" || role === "worker") return role;
  } catch (e) {}
  return null;
}

function persistRole(role) {
  try {
    localStorage.setItem("bp-active-role", role);
    localStorage.removeItem("bp-worker-onboarding");
  } catch (e) {}
}

function App() {
  const queryRole = getRoleFromQuery();
  const [stage, setStage] = useState("idle"); // idle / loading / error
  const [chosenRole, setChosenRole] = useState(queryRole || "client");
  const [errMsg, setErrMsg] = useState("");

  // Already signed in? Redirect to their dashboard
  useEffect(() => {
    if (!window.bpAuth) return;
    window.bpAuth.getSession().then(({ session }) => {
      if (session?.user) {
        let role = chosenRole;
        try { role = localStorage.getItem("bp-active-role") || chosenRole; } catch (e) {}
        window.location.href = "app.html?role=" + role + "&signedin=1";
      }
    });
  }, []);

  const onProviderClick = async () => {
    setErrMsg("");
    if (!window.bpAuth) {
      setErrMsg("Auth SDK 還沒載入、過幾秒再試");
      return;
    }
    persistRole(chosenRole);
    setStage("loading");
    const redirectTo = window.location.origin + window.location.pathname.replace(/sign-in\.html$/, "app.html") + "?role=" + chosenRole + "&signedin=1";
    const { error } = await window.bpAuth.signInWithGoogle(redirectTo);
    if (error) {
      setStage("error");
      setErrMsg("Google 登入失敗：" + error.message);
    }
    // On success Supabase navigates the page to Google OAuth, then back to redirectTo
  };

  return (
    <div className="si-root">
      <div className="si-top">
        <span className="mark"></span>
        <span className="name">Beyond<span className="accent">Path</span></span>
        <small>SIGN IN · v0.4β</small>
      </div>

      <div className="si-main">
        <AmbientMesh />
        <div className="si-card">
          {stage !== "loading" && (
            <>
              <div className="si-eyebrow">◆ WELCOME BACK</div>
              <h1 className="si-h">登入 BeyondPath。</h1>
              <p className="si-sub">繼續你的案件、檢查配對結果、或更新 Tier 進度。</p>

              <div className="si-disclaimer">
                <span className="icon">●</span>
                <div className="text">
                  <b>EARLY BETA ·</b> 用你的 Google 帳號登入 · BeyondPath 只會看到你的 email 與大頭照 · 不存其他資料 · 後續流程都可隨時退出。
                </div>
              </div>
              {errMsg && (
                <div style={{ background: "rgba(212,113,42,0.1)", border: "1px solid rgba(212,113,42,0.4)", color: "oklch(0.82 0.16 75)", padding: "10px 14px", borderRadius: 4, marginBottom: 18, fontSize: 13 }}>⚠ {errMsg}</div>
              )}

              {/* Role select - 用戶自選進哪個 dashboard */}
              <div style={{ display: "flex", gap: 8, marginBottom: 18, padding: 4, background: "var(--bg-1)", border: "1px solid var(--line)", borderRadius: 4 }}>
                <button
                  onClick={() => setChosenRole("client")}
                  style={{
                    flex: 1, padding: "10px 14px", background: chosenRole === "client" ? "var(--accent)" : "transparent",
                    color: chosenRole === "client" ? "var(--bg)" : "var(--muted)",
                    border: 0, borderRadius: 3, cursor: "pointer",
                    font: "600 12px/1 var(--mono)", letterSpacing: "0.1em"
                  }}
                >
                  我要發案 · CLIENT
                </button>
                <button
                  onClick={() => setChosenRole("worker")}
                  style={{
                    flex: 1, padding: "10px 14px", background: chosenRole === "worker" ? "var(--accent)" : "transparent",
                    color: chosenRole === "worker" ? "var(--bg)" : "var(--muted)",
                    border: 0, borderRadius: 3, cursor: "pointer",
                    font: "600 12px/1 var(--mono)", letterSpacing: "0.1em"
                  }}
                >
                  我要接案 · WORKER
                </button>
              </div>

              <div className="si-providers">
                <button className="si-btn" onClick={onProviderClick}>
                  <GoogleLogo />
                  <span>Continue with Google</span>
                  <span className="arr">→</span>
                </button>
              </div>

              <div className="si-foot">
                還沒帳號？<a href="app.html?role=client&step=0">用發案表單試一次（不需註冊）→</a><br/>
                想接案？<a href="app.html?role=worker&onboarding=1">看 Tier B 認證流程 →</a>
              </div>
            </>
          )}

          {stage === "loading" && (
            <div className="si-loading">
              <div className="si-spinner"></div>
              <div className="si-loading-text">VERIFYING · {chosenRole.toUpperCase()}</div>
              <div className="si-loading-sub">登入中、即將進入你的{chosenRole === "client" ? "客戶" : "工作"}儀表板…</div>
            </div>
          )}
        </div>
      </div>

      <div className="si-bottom">
        <div>© 2026 BEYONDPATH NETWORK · TPE × SGP × TYO</div>
        <div>
          <a href="landing.html">← 回首頁</a>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
