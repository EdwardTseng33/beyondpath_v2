<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="components/styles.css?v=2026-06-10-quota">

<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0a0a0b; font-family: "IBM Plex Sans", "Noto Sans TC", system-ui, sans-serif; color: #e8e8ea; }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 16px;
    box-sizing: border-box;
    /* radial vignette so iPhone "floats" */
    background: radial-gradient(ellipse at center top, #15151a 0%, #0a0a0b 60%);
  }
  #root { display: flex; align-items: flex-start; justify-content: center; }

  /* iPhone frame fills viewport on actual mobile (≤480px) — no chrome, just app */
  @media (max-width: 480px) {
    body { padding: 0; background: #000; }
    .ios-stage { transform: none !important; }
    .ios-device-shell {
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }
    .ios-device-shell > div[style*="border-radius: 48"] {
      border-radius: 0 !important;
      box-shadow: none !important;
    }
  }

  /* Optional: top hint label only shown on desktop (zoom hint) */
  .device-hint {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: #7a7a82; letter-spacing: 0.08em;
    padding: 6px 12px; background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;
    z-index: 100; pointer-events: none;
  }
  @media (max-width: 480px) { .device-hint { display: none; } }
</style>
</head>
<body>


<div class="device-hint">BEYONDPATH · MOBILE · iPhone 15</div>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="env,react">
const { ClientIntakeApp, IOSDevice } = window;

function MobileRoot() {
  return (
    <div className="ios-device-shell" style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'center' }}>
      <IOSDevice width={402} height={874} dark>
        <div style={{ height: '100%', width: '100%', overflow: 'hidden', paddingTop: 54, position: 'relative', display: 'flex', flexDirection: 'column' }}>
          <ClientIntakeApp device="mobile" />
        </div>
      </IOSDevice>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<MobileRoot />);
</script>
