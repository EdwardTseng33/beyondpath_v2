<!doctype html>

<title>BeyondPath · Mobile Prototype</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="components/styles.css">

<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #0a0a0b; font-family: "IBM Plex Sans", "Noto Sans TC", system-ui, sans-serif; color: #e8e8ea; }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 16px;
    box-sizing: border-box;
    /* radial vignette so iPhone "floats" */
    background: radial-gradient(ellipse at center top, #15151a 0%, #0a0a0b 60%);
  }
  #root { display: flex; align-items: flex-start; justify-content: center; }

  /* iPhone frame fills viewport on actual mobile (≤480px) — no chrome, just app */
  @media (max-width: 480px) {
    body { padding: 0; background: #000; }
    .ios-stage { transform: none !important; }
    .ios-device-shell {
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }
    .ios-device-shell > div[style*="border-radius: 48"] {
      border-radius: 0 !important;
      box-shadow: none !important;
    }
  }

  /* Optional: top hint label only shown on desktop (zoom hint) */
  .device-hint {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: #7a7a82; letter-spacing: 0.08em;
    padding: 6px 12px; background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;
    z-index: 100; pointer-events: none;
  }
  @media (max-width: 480px) { .device-hint { display: none; } }
</style>
</head>
<body>

<div id="bp-disc-top" style="position:fixed;top:0;left:0;right:0;background:#1a1a08;background-image:repeating-linear-gradient(45deg, rgba(255,248,212,0.04) 0 8px, transparent 8px 16px);color:#fff8d4;padding:8px 18px;font:500 11px/1.5 'JetBrains Mono','SF Mono',monospace;display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(255,248,212,0.12);z-index:200;">
  <span style="font-size:14px;flex:0 0 auto;">🚧</span>
  <span style="font-weight:700;letter-spacing:0.08em;flex:0 0 auto;">PROTOTYPE DEMO · 非正式服務</span>
  <span style="flex:1;min-width:0;opacity:0.88;font-family:'Noto Sans TC',system-ui,sans-serif;font-weight:400;font-size:11.5px;">所有資料皆為模擬 · 不收費 / 不簽法律效力文件 · 正式上線預計 2026 Q3 · <a href="mailto:edwardt0303@gmail.com?subject=BeyondPath%20Waitlist" style="color:#c7e84a;text-decoration:none;border-bottom:1px solid rgba(199,232,74,0.4);padding-bottom:1px;">加入 waitlist →</a></span>
  <button onclick="document.getElementById('bp-disc-top').style.display='none'; sessionStorage.setItem('bp-disc-closed','1');" style="background:transparent;border:0;color:#fff8d4;font-size:16px;cursor:pointer;padding:4px 8px;opacity:0.6;flex:0 0 auto;">×</button>
</div>
<script>
  if (sessionStorage.getItem('bp-disc-closed') === '1') {
    document.getElementById('bp-disc-top').style.display = 'none';
  }
</script>

const { ClientIntakeApp, IOSDevice } = window;

function MobileRoot() {
