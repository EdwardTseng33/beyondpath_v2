<script>
  // === BeyondPath Query Param Bootstrap (v1.5 · sprint round 5) ===
  // Read ?role=client|worker  ?step=0..11  ?onboarding=0|1  ?view=worker-demo|worker-apply
  // Override localStorage so cold-start users land where landing.html intends
  (function() {
    try {
      var qs = new URLSearchParams(window.location.search);
      var role = qs.get("role");
      var step = qs.get("step");
      var onboarding = qs.get("onboarding");
      var view = qs.get("view");

      if (view === "worker-demo" || view === "worker-dashboard") {
        role = "worker";
        onboarding = "0";
      } else if (view === "worker-apply") {
        role = "worker";
        onboarding = "1";
      }

      if (role === "client" || role === "worker") {
        localStorage.setItem("bp-active-role", role);
      } else if (!localStorage.getItem("bp-active-role")) {
        localStorage.setItem("bp-active-role", "client");
      }

      if (step !== null) {
        var n = parseInt(step, 10);
        if (Number.isFinite(n) && n >= 0 && n <= 11) {
          localStorage.setItem("bp-journey-step", String(n));
        }
      }

      if (onboarding === "1") {
        localStorage.setItem("bp-worker-onboarding", "1");
      } else if (onboarding === "0") {
        localStorage.removeItem("bp-worker-onboarding");
      }
    } catch (e) {
      console.warn("[BP] query-param bootstrap failed:", e);
    }
  })();
</script>

<script>
  // === app.html · disclaimer / footer i18n binding (Step 3c - 2026-05-25) ===
  (function() {
    function applyDataI18n() {
      var nodes = document.querySelectorAll('[data-i18n]');
      for (var i = 0; i < nodes.length; i++) {
        var el = nodes[i];
        var key = el.getAttribute('data-i18n');
        if (!el.hasAttribute('data-i18n-fallback')) {
          el.setAttribute('data-i18n-fallback', (el.textContent || '').trim());
        }
        var fb = el.getAttribute('data-i18n-fallback');
        el.textContent = window.BPi18n ? window.BPi18n.t(key, fb) : fb;
      }
      var attrNodes = document.querySelectorAll('[data-i18n-attr]');
      for (var j = 0; j < attrNodes.length; j++) {
        var ael = attrNodes[j];
        var spec = ael.getAttribute('data-i18n-attr');
        var parts = spec.split(':');
        if (parts.length === 2 && window.BPi18n) {
          ael.setAttribute(parts[0], window.BPi18n.t(parts[1], ael.getAttribute(parts[0]) || ''));
        }
      }
    }
    document.addEventListener('i18n:change', applyDataI18n);
    function ready() {
      applyDataI18n();
      // Mount lang switcher into the existing React shell topbar (.bp-shell-meta)
      // Wait for React to render the shell before mounting. No fallback to disclaimer.
      function tryMount() {
        if (!window.React || !window.ReactDOM || !window.BPLangSwitcher) return false;
        if (document.getElementById('app-lang-switcher')) return true;
        var meta = document.querySelector('.bp-shell-meta');
        if (!meta) return false;
        var sw = document.createElement('div');
        sw.id = 'app-lang-switcher';
        sw.style.cssText = 'display:inline-flex;align-items:center;margin-right:6px;';
        meta.insertBefore(sw, meta.firstChild);
        ReactDOM.createRoot(sw).render(React.createElement(window.BPLangSwitcher));
        return true;
      }
      var tries = 0;
      var poll = setInterval(function() {
        tries++;
        if (tryMount() || tries > 100) clearInterval(poll);
      }, 100);
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', ready);
    } else { ready(); }
  })();
</script>

<script type="text/babel" data-presets="env,react">
const { BP_AppShell, ClientIntakeApp, IOSDevice } = window;
const { useState, useEffect } = React;

function useIsMobile() {
  const [isMobile, setIsMobile] = useState(() => {
    if (typeof window === 'undefined') return false;
    return window.innerWidth <= 768;
  });
  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth <= 768);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  return isMobile;
}

function MobileShell() {
  return (
    <div className="rwd-mobile-stage">
      <div className="rwd-iphone-wrap" style={{ display: 'flex' }}>
        <IOSDevice width={402} height={874} dark>
          <div style={{ height: '100%', width: '100%', overflow: 'hidden', paddingTop: 54, position: 'relative', display: 'flex', flexDirection: 'column' }}>
            <ClientIntakeApp device="mobile" />
          </div>
        </IOSDevice>
      </div>
    </div>
  );
}

function Root() {
  const isMobile = useIsMobile();
  const isWorkerEntry = (() => {
    try {
      const qs = new URLSearchParams(window.location.search);
      return qs.get("role") === "worker" || localStorage.getItem("bp-active-role") === "worker";
    } catch (e) {
      return false;
    }
  })();
  return isMobile && !isWorkerEntry ? <MobileShell /> : <BP_AppShell />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
