  /* i18n DOM walker · Phase 1 Step 1 (2026-05-25)
   * - 處理 [data-i18n="path"] textContent swap
   * - 處理 [data-i18n-attr="attrName:path"] attribute swap
   * - 處理 <title> + meta description swap
   * - re-run 在每次 i18n:change event 觸發
   */
  (function () {
    function applyI18n() {
      if (!window.BPi18n) return;
      var t = window.BPi18n.t;
      var lang = window.BPi18n.getLang();
      // title + meta
      var titleEl = document.querySelector('title');
      if (titleEl) titleEl.textContent = t('meta.title', titleEl.textContent);
      var descEl = document.querySelector('meta[name="description"]');
      if (descEl) descEl.setAttribute('content', t('meta.description', descEl.getAttribute('content')));
      var ogTitle = document.querySelector('meta[property="og:title"]');
      if (ogTitle) ogTitle.setAttribute('content', t('meta.og_title', ogTitle.getAttribute('content')));
      var ogDesc = document.querySelector('meta[property="og:description"]');
      if (ogDesc) ogDesc.setAttribute('content', t('meta.og_description', ogDesc.getAttribute('content')));
      var ogLocale = document.querySelector('meta[property="og:locale"]');
      if (ogLocale) ogLocale.setAttribute('content', lang === 'en' ? 'en_US' : 'zh_TW');
      // text content
      var nodes = document.querySelectorAll('[data-i18n]');
      for (var i = 0; i < nodes.length; i++) {
        var k = nodes[i].getAttribute('data-i18n');
        nodes[i].textContent = t(k, nodes[i].textContent);
      }
      // attributes (format: "attrName:dotPath")
      var attrNodes = document.querySelectorAll('[data-i18n-attr]');
      for (var j = 0; j < attrNodes.length; j++) {
        var spec = attrNodes[j].getAttribute('data-i18n-attr');
        var parts = spec.split(':');
        if (parts.length === 2) {
          attrNodes[j].setAttribute(parts[0], t(parts[1], attrNodes[j].getAttribute(parts[0])));
        }
      }
    }
    function ready(fn) {
      if (document.readyState !== 'loading') { fn(); return; }
      document.addEventListener('DOMContentLoaded', fn);
    }
    ready(function () {
      applyI18n();
      document.addEventListener('i18n:change', applyI18n);
    });
  })();
</script>

const { useState, useEffect, useRef, useMemo } = React;

function useLangRerender() {

// Heromark · 5-tier orbital
function Heromark({ size = 360, label = "BEYONDPATH", sub = "FLYWHEEL" }) {
  const tiers = [
    { id: "S",  r: size * 0.40, color: "var(--accent)",       speed: 24, planet: 22 },
    { id: "A+", r: size * 0.32, color: "var(--accent-dim)",   speed: 32, planet: 18 },
    { id: "A",  r: size * 0.24, color: "var(--text)",         speed: 40, planet: 15 },
    { id: "B",  r: size * 0.16, color: "var(--muted)",        speed: 48, planet: 15 },
    { id: "C",  r: size * 0.10, color: "var(--muted-2)",      speed: 56, planet: 14 }
  ];
  const half = size / 2;
  const viewBox = "-" + half + " -" + half + " " + size + " " + size;
  return (
    <div style={{ width: size, height: size, position: "relative" }}>
      <svg viewBox={viewBox} style={{ width: "100%", height: "100%", display: "block" }}>
        <defs>
          <radialGradient id={"hmCore" + size} cx="50%" cy="50%" r="50%">
            <stop offset="0%" stopColor="var(--accent)" stopOpacity="0.9" />
            <stop offset="60%" stopColor="var(--accent)" stopOpacity="0.15" />
            <stop offset="100%" stopColor="var(--accent)" stopOpacity="0" />
          </radialGradient>
        </defs>
        <circle r={size * 0.36} fill={"url(#hmCore" + size + ")"} opacity="0.25" />
        {tiers.map((t, i) => (
          <g key={"r-" + t.id}>
            <circle r={t.r} fill="none" stroke={t.color} strokeOpacity="0.18" strokeDasharray="3 5" />
            <circle r={t.r} fill="none" stroke={t.color} strokeOpacity="0.55" strokeWidth="1.2"
                    strokeDasharray={(t.r * 0.6) + " " + (t.r * 5.4)}
                    transform={"rotate(" + (-90 - i * 18) + ")"} />
          </g>
        ))}
        {tiers.map((t, i) => (
          <g key={"p-" + t.id}>
            <animateTransform attributeName="transform" attributeType="XML"
              type="rotate" from={(i * 47) + " 0 0"} to={(360 + i * 47) + " 0 0"}

            <circle cx={t.r} cy={0} r={t.planet + 8} fill={t.color} opacity="0.18" />
            <circle cx={t.r} cy={0} r={t.planet} fill={t.color} stroke={t.color} strokeWidth="1" />
            <text x={t.r} y={5} fill="var(--bg)" fontSize={t.planet * 0.95}
                  fontWeight="800" textAnchor="middle"
                  fontFamily="var(--sans)">{t.id}</text>
          </g>
        ))}
        <circle r={size * 0.062} fill="var(--bg)" stroke="var(--accent)" strokeWidth="1.2" />
        <text y="-1" fill="var(--accent)" fontSize={size * 0.028} fontFamily="var(--mono)"
              textAnchor="middle" letterSpacing="2" fontWeight="700">CORE</text>
        <text y={size * 0.034} fill="var(--text)" fontSize={size * 0.028}
              fontFamily="var(--sans)" textAnchor="middle" fontWeight="700">PROTOCOL</text>
      </svg>
      {label && size >= 240 && (
        <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column",
                       alignItems: "center", justifyContent: "flex-end", paddingBottom: size * 0.06,
                       pointerEvents: "none" }}>

                         color: "var(--muted)", marginTop: 4 }}>{sub}</div>
        </div>
      )}
    </div>
  );
}

  const lines = useMemo(() => {

          ctx.fillStyle = i < 6
            ? "rgba(199,232,74," + (0.25 + 0.5 * Math.sin(t + i)) + ")"
            : "rgba(199,232,74,0.14)";
          ctx.fillRect(i * 22, H - w, 14, w);
        }
      } else if (kind === "MatchMock") {
        const cx = W / 2, cy = H / 2;
        ctx.strokeStyle = "rgba(199,232,74,0.4)"; ctx.lineWidth = 0.6;
        for (let i = 0; i < 6; i++) {
          const a = i / 6 * Math.PI * 2 + t * 0.4;
          const r = 32 + 4 * Math.sin(t * 2 + i);
          ctx.beginPath(); ctx.moveTo(cx, cy);
          ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.stroke();
          ctx.fillStyle = i === 0 ? "rgba(199,232,74,1)" : "rgba(199,232,74,0.55)";
          ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 3, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = "rgba(232,232,234,0.9)";
        ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();
      } else if (kind === "ContractMock") {
        ctx.strokeStyle = "rgba(199,232,74,0.5)"; ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x < W; x++) {
          const y = H / 2 + Math.sin((x + t * 40) * 0.04) * 14 * Math.sin((x + t * 20) * 0.012);
          if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.fillStyle = "rgba(199,232,74,0.85)"; ctx.fillRect(W - 30, 8, 22, 22);
        ctx.fillStyle = "#0a0a0b"; ctx.font = "bold 11px monospace";
        ctx.fillText("30%", W - 28, 22);
      } else if (kind === "DashMock") {
        for (let i = 0; i < 5; i++) {
          const fill = i < 1 + Math.floor(t * 0.6 % 5);
          ctx.fillStyle = fill ? "rgba(199,232,74,1)" : "#222";
          ctx.fillRect(i * 60 + 8, 30, 50, 30);
          ctx.fillStyle = fill ? "#0a0a0b" : "rgba(122,122,130,1)";
          ctx.font = "bold 10px monospace";
          ctx.fillText("M" + (i + 1), i * 60 + 22, 49);
        }
      } else if (kind === "NPSMock") {
        const cx = W / 2, cy = H + 20, r = 64;
        ctx.lineWidth = 8;
        ctx.strokeStyle = "#1a1a1a";
        ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 0); ctx.stroke();
        const v = 0.55 + 0.15 * Math.sin(t);
        ctx.strokeStyle = "rgba(199,232,74,1)";
        ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, Math.PI + Math.PI * v); ctx.stroke();
        ctx.fillStyle = "rgba(232,232,234,1)"; ctx.font = "bold 18px sans-serif";
        ctx.fillText(Math.floor(v * 100), cx - 12, cy - 12);
      } else if (kind === "RetainerMock") {
        for (let i = 0; i < 6; i++) {
          const o = (i + t * 0.3) % 6;
          ctx.fillStyle = "rgba(199,232,74," + (0.15 + (5 - o) / 15) + ")";
          ctx.fillRect(i * 48 + 10, 20, 38, 50);
          ctx.fillStyle = "rgba(122,122,130,1)"; ctx.font = "9px monospace";
          ctx.fillText("M" + (i + 1), i * 48 + 20, 80);
        }
      }
      raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
    return () => cancelAnimationFrame(raf);
  }, [kind]);
  return <canvas ref={ref} />;
}

// Worker Decision Banner · v0.5 (2026-05-19) · Q3 Task 4 配套 · 處理 worker-accept-decline Edge Function redirect 後的 ?worker_decision=...&action=... query string
function EWorkerDecisionBanner() {
  useLangRerender();
  const [info, setInfo] = React.useState(null);
  React.useEffect(() => {
    try {
      const params = new URLSearchParams(window.location.search);
      const decision = params.get("worker_decision");
      const action = params.get("action");
      if (!decision) return;
      let next;
      if (decision === "success" && action === "accept") {
        next = { kind: "ok", title: t("banner.ok_title", "已接受配對邀請"), body: t("banner.ok_body", "BeyondPath 24-72 小時內準備合約草稿與案件初始 milestone、寄到你的 email。客戶端也會收到「worker 已確認接案」通知。若 72 小時無收信、請聯絡 hello@beyondpath.tw。") };
      } else if (decision === "success" && action === "decline") {
        next = { kind: "neutral", title: t("banner.decline_title", "已記錄你婉拒這次配對"), body: t("banner.decline_body", "謝謝告知。下次有適配案件、BeyondPath 仍會優先推薦。") };
      } else if (decision === "error") {
        next = { kind: "warn", title: t("banner.error_title", "配對連結已過期或無效"), body: t("banner.error_body", "邀請信連結有 7 天效期。請聯絡 BeyondPath：hello@beyondpath.tw") };
      } else {
        next = { kind: "neutral", title: t("banner.default_title", "感謝你的回應"), body: t("banner.default_body", "若有疑問請聯絡 BeyondPath：hello@beyondpath.tw") };
      }
      setInfo(next);
      // 清掉 URL query、避免 reload 重複顯示
      window.history.replaceState({}, "", window.location.pathname);
    } catch (e) {
      // ignore
    }
  }, []);

  if (!info) return null;

  const color = info.kind === "ok" ? "var(--accent)" : info.kind === "warn" ? "oklch(0.82 0.16 75)" : "var(--text-2)";

  return (
    <div style={{
      position: "fixed",
      top: 16,
      left: "50%",
      transform: "translateX(-50%)",
      maxWidth: 520,
      width: "calc(100% - 32px)",
      zIndex: 9999,
      padding: "14px 18px",
      background: "var(--bg)",
      border: "1px solid " + color,
      boxShadow: "0 8px 32px rgba(0,0,0,0.5)",
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 14 }}>
        <div style={{ flex: 1 }}>
          <div style={{ fontFamily: "var(--mono)", fontSize: 11, letterSpacing: "0.12em", color: color, marginBottom: 6 }}>
            {t("banner.label", "◆ WORKER DECISION")}
          </div>
          <div className="le-zh" style={{ fontSize: 15, fontWeight: 600, color: "var(--text)", marginBottom: 4 }}>
            {info.title}
          </div>
          <div className="le-zh" style={{ fontSize: 13, color: "var(--text-2)", lineHeight: 1.6 }}>
            {info.body}
          </div>
        </div>
        <button
          onClick={() => setInfo(null)}
          style={{ background: "transparent", border: 0, color: "var(--muted)", cursor: "pointer", fontSize: 22, padding: 0, lineHeight: 1 }}
          aria-label={t("banner.close_aria", "關閉")}
        >×</button>
      </div>
    </div>
  );
}

// v0.3 sticky nav scrolled state + back-to-top fade-in
(function () {
  let throttleTimer = null;
  let lastScroll = 0;
  let ticking = false;
  function update() {
    const y = lastScroll;
    const nav = document.querySelector(".le-nav");
    const totop = document.querySelector(".le-totop");
    const threshold = window.innerHeight;
    if (nav) nav.classList.toggle("scrolled", y > threshold);
    if (totop) totop.classList.toggle("visible", y > threshold);
    ticking = false;
  }
  function onScroll() {
    lastScroll = window.scrollY || window.pageYOffset || 0;
    if (!ticking) {
      window.requestAnimationFrame(update);
      ticking = true;
    }
  }
  window.addEventListener("scroll", function () {
    if (throttleTimer) return;
    throttleTimer = setTimeout(function () { onScroll(); throttleTimer = null; }, 200);
    onScroll();
  }, { passive: true });

  function mountToTop() {
    if (document.querySelector(".le-totop")) return;
    const btn = document.createElement("button");
    btn.className = "le-totop";
    btn.setAttribute("aria-label", (window.BPi18n ? window.BPi18n.t("misc.back_to_top", "回到頂部") : "回到頂部"));
    btn.innerHTML = "↑";
    btn.addEventListener("click", function () {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    document.body.appendChild(btn);
  }
  setTimeout(mountToTop, 600);
})();
</script>
