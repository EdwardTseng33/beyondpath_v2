<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BeyondPath · 華語區 AI 工作者認證網路</title>
<meta name="description" content="華語區第一個 AI 工作者認證網路。通過率 < 10% · escrow 託管 · worker 淨拿 95% · Tier 認證資產。" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="components/styles.css">
<style>
  /* ========= Base ========= */
  html, body { margin: 0; padding: 0; background: var(--bg); font-family: var(--sans); color: var(--text); }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  #root { flex: 1; min-height: 0; }

  /* ========= Disclaimer banner ========= */
  .bp-disclaimer-top { flex: 0 0 auto; background: #1a1a08; background-image: repeating-linear-gradient(45deg, rgba(255,248,212,0.04) 0 8px, transparent 8px 16px); color: #fff8d4; padding: 8px 18px; font: 500 11px/1.5 var(--mono); display: flex; align-items: center; gap: 14px; border-bottom: 1px solid rgba(255,248,212,0.12); position: relative; z-index: 100; }
  .bp-disclaimer-top .icon { font-size: 14px; flex: 0 0 auto; }
  .bp-disclaimer-top .label { font-weight: 700; letter-spacing: 0.08em; flex: 0 0 auto; }
  .bp-disclaimer-top .body { flex: 1; min-width: 0; opacity: 0.88; font-family: var(--zh); font-weight: 400; font-size: 11.5px; }
  .bp-disclaimer-top a { color: #c7e84a; text-decoration: none; border-bottom: 1px solid rgba(199,232,74,0.4); padding-bottom: 1px; }
  .bp-disclaimer-top a:hover { border-bottom-color: #c7e84a; }
  .bp-disclaimer-top .close { background: transparent; border: 0; color: #fff8d4; font-size: 16px; cursor: pointer; padding: 4px 8px; opacity: 0.6; flex: 0 0 auto; }
  .bp-disclaimer-top .close:hover { opacity: 1; }
  @media (max-width: 768px) { .bp-disclaimer-top { flex-wrap: wrap; padding: 6px 12px; gap: 6px; font-size: 10.5px; } .bp-disclaimer-top .body { font-size: 10.5px; flex-basis: 100%; order: 3; } .bp-disclaimer-top .close { order: 2; } }
  .bp-disclaimer-foot { flex: 0 0 auto; background: #050507; color: #6a6a6c; padding: 14px 18px; font: 500 11px/1.6 var(--mono); text-align: center; border-top: 1px solid rgba(255,255,255,0.04); }
  .bp-disclaimer-foot a { color: #9a9aa3; text-decoration: none; border-bottom: 1px solid rgba(199,232,74,0.3); padding-bottom: 1px; }
  .bp-disclaimer-foot a:hover { color: #c7e84a; border-bottom-color: #c7e84a; }
  @media (max-width: 768px) { .bp-disclaimer-foot { text-align: left; padding: 12px 14px; font-size: 10px; } }

  /* ========= Synapse · root ========= */
  /* v0.4.6 (2026-05-10) 女巫 fix-6 · local muted override 達 WCAG AA 5.6:1（原 #7a786f 4.0:1 邊緣 fail） */
  .le-root { --muted: #9a9aa3; --muted-2: #6f6f78; background: var(--bg); color: var(--text); font-family: var(--sans); position: relative; overflow: hidden; }
  .le-root *, .le-root *::before, .le-root *::after { box-sizing: border-box; }
  .le-mono { font-family: var(--mono); letter-spacing: 0.04em; }
  .le-zh { font-family: var(--zh); }
  .le-disp { font-family: var(--sans); font-weight: 800; letter-spacing: -0.04em; }
  .le-cap { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  .le-acc { color: var(--accent); }
  .le-acc-dim { color: var(--accent-dim); }
  .le-info { color: var(--info); }
  .le-warn { color: var(--warn); }
  .le-text2 { color: var(--text-2); }

  /* v0.3 cut leScan + leTape + leFlick - keep leBreath only */
  @keyframes leBreath { 0%,100%{box-shadow:0 0 0 0 oklch(0.88 0.22 128 / 0.4)} 50%{box-shadow:0 0 0 6px oklch(0.88 0.22 128 / 0)} }
  .le-pulse { animation: leBreath 2s ease-in-out infinite; }

  /* v0.3 le-grad animation cut */
  .le-grad { background: linear-gradient(96deg, var(--text) 0%, var(--accent) 50%, var(--text) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* v0.3 le-noise SVG turbulence cut */

  .le-card { background: rgba(255,255,255,0.02); border: 1px solid var(--line); }
  .le-card:hover { border-color: var(--accent-line); }
  .le-divider { height: 1px; background: linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent); }

  /* ========= Live ticker ========= */
  .le-ticker { display: flex; gap: 0; font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.14em; border-bottom: 1px solid var(--line-soft); background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); }
  .le-ticker .item { flex: 1; padding: 12px 18px; border-right: 1px solid var(--line-soft); display: flex; gap: 12px; align-items: center; }
  .le-ticker .item:last-child { border-right: none; flex: 0 0 200px; }
  .le-ticker .item .k { color: var(--muted-2); }
  @media (max-width: 768px) { .le-ticker { overflow-x: auto; -webkit-overflow-scrolling: touch; white-space: nowrap; } .le-ticker::-webkit-scrollbar { display: none; } .le-ticker .item { padding: 10px 14px; flex: 0 0 auto; font-size: 10px; } .le-ticker .item:last-child { flex: 0 0 auto; } }

  /* ========= Nav ========= */
  .le-nav { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; padding: 14px 56px; background: rgba(10,10,11,0.85); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line-soft); }
  .le-nav .brand { font-family: var(--sans); font-weight: 800; font-size: 22px; letter-spacing: -0.03em; }
  .le-nav .brand small { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: 0.2em; margin-left: 10px; }
  .le-nav .links { display: flex; gap: 28px; margin-left: 60px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; }
  .le-nav .links a { color: var(--muted); text-decoration: none; transition: color 120ms; }
  .le-nav .links a:hover { color: var(--text); }
  .le-nav .actions { margin-left: auto; display: flex; gap: 12px; }
  .le-nav .btn-ghost { background: transparent; border: 1px solid var(--accent-line); color: var(--text); padding: 9px 16px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; cursor: pointer; text-decoration: none; }
  .le-nav .btn-primary { background: var(--accent); border: 0; color: var(--bg); padding: 9px 18px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; font-weight: 700; cursor: pointer; text-decoration: none; }
  @media (max-width: 900px) { .le-nav { padding: 12px 16px; gap: 8px; } .le-nav .links { display: none; } .le-nav .brand { font-size: 18px; } .le-nav .brand small { display: none; } .le-nav .btn-ghost { display: none; } .le-nav .btn-primary { padding: 8px 12px; font-size: 10px; } }

  /* v0.3 sticky scrolled state */
  .le-nav { transition: padding 240ms ease, background 240ms ease, border-color 240ms ease; }
  .le-nav.scrolled { background: rgba(10,10,11,0.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--accent); padding-top: 10px; padding-bottom: 10px; box-shadow: 0 2px 16px rgba(199, 232, 74, 0.12), 0 8px 24px rgba(0, 0, 0, 0.4); }
  .le-nav.scrolled .brand { font-size: 18px; transition: font-size 240ms ease; }
  .le-nav.scrolled .btn-primary, .le-nav.scrolled .btn-ghost { padding: 7px 14px; transition: padding 240ms ease; }

  /* v0.3 back-to-top button */
  .le-totop { position: fixed; right: 24px; bottom: 24px; width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--bg); border: 0; font-family: var(--mono); font-size: 18px; font-weight: 800; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 280ms ease, transform 240ms ease; z-index: 60; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0,0,0,0.4); }
  .le-totop.visible { opacity: 1; pointer-events: auto; }
  .le-totop:hover { transform: translateY(-2px); }
  @media (max-width: 900px) { .le-totop { right: 16px; bottom: 16px; width: 40px; height: 40px; font-size: 16px; } }

  /* v0.3 zh-Hant universal font rule (council E spec) */
  :lang(zh-Hant) h1, :lang(zh-Hant) h2, :lang(zh-Hant) h3,
  .le-hero-title, .le-h2, .le-manifesto-h, .le-finalcta .h, .le-founder .quote {
    word-break: keep-all;
    text-wrap: balance;
    font-feature-settings: "palt" 1, "kern" 1;
  }
  .le-hero-blurb, .le-zh p, .le-engine-card .desc, .le-whyus-card .body,
  .le-trust-strip .chip .body, .le-tier-row .info .zh, .le-vision-row .desc,
  .le-trust3-cell .desc, .le-trust3-cell .zh, .le-faq .body, .le-faq summary,
  .le-vert-grid .cell .name, .le-engine-card .zh, .le-whyus-card .ttl,
  .le-trust-strip .chip .ttl, .le-protocol-grid .cell .t,
  .le-story-block .h, .le-story-block .body { word-break: keep-all; line-break: strict; }

  /* v0.3 static-bar (replace LiveTicker) */
  .le-staticbar { display: flex; gap: 0; font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.14em; border-bottom: 1px solid var(--line-soft); background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); }
  .le-staticbar .item { flex: 1; padding: 12px 18px; border-right: 1px solid var(--line-soft); display: flex; gap: 12px; align-items: center; min-width: 0; }
  .le-staticbar .item:last-child { border-right: none; }
  .le-staticbar .item .k { color: var(--muted-2); }
  @media (max-width: 768px) { .le-staticbar { overflow-x: auto; -webkit-overflow-scrolling: touch; white-space: nowrap; } .le-staticbar::-webkit-scrollbar { display: none; } .le-staticbar .item { padding: 10px 14px; flex: 0 0 auto; font-size: 10px; } }

  /* v0.4.6 (2026-05-10) 3-段敘事 story · padding 砍 1/3、gap 砍半、H 砍 1/3——避免佔 1.5-2 viewport */
  .le-story { padding: 56px 56px; border-top: 1px solid var(--line); background: var(--bg); }
  @media (max-width: 900px) { .le-story { padding: 40px 24px; } }
  .le-story-inner { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px; }
  @media (max-width: 1100px) { .le-story-inner { gap: 40px; } }
  @media (max-width: 900px) { .le-story-inner { gap: 32px; } }
  .le-story-block .label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; color: var(--accent); margin-bottom: 16px; display: inline-flex; align-items: center; gap: 10px; font-weight: 700; opacity: 0.72; }
  .le-story-block .label .mark-line { display: inline-block; width: 16px; height: 1px; background: rgba(199,232,74,0.35); }
  .le-story-block .h { font-family: var(--zh); font-size: 44px; font-weight: 800; line-height: 1.22; color: var(--text); margin: 0 0 14px; max-width: 32ch; word-break: keep-all; text-wrap: balance; letter-spacing: -0.02em; }
  @media (max-width: 1200px) { .le-story-block .h { font-size: 38px; } }
  @media (max-width: 900px) { .le-story-block .h { font-size: 26px; line-height: 1.28; } }
  /* v0.4.6 (2026-05-10) 女巫 fix-2 · 「我們不是又一個媒合平台」是 manifesto peak、應有 hero-claim 級重量 */
  .le-story-block.peak .h { font-size: 56px; line-height: 1.18; padding-left: 28px; border-left: 2px solid var(--accent); }
  @media (max-width: 1200px) { .le-story-block.peak .h { font-size: 48px; } }
  @media (max-width: 900px) { .le-story-block.peak .h { font-size: 32px; padding-left: 16px; border-left-width: 1px; } }
  .le-story-block.peak { padding: 24px 0; }
  .le-story-block .body { font-family: var(--zh); font-size: 17px; line-height: 1.85; color: var(--text-2); max-width: 36ch; word-break: keep-all; }
  @media (max-width: 900px) { .le-story-block .body { font-size: 15px; line-height: 1.8; } }
  .le-story-block .body .who { color: var(--accent); font-weight: 600; display: block; margin-bottom: 10px; font-size: 14px; letter-spacing: 0.04em; }
  .le-story-block .body .gap { display: block; height: 28px; }

  /* v0.3 engine static-mock (replace 4 of 6 canvas) */
  .le-engine-card .static-mock { width: 100%; height: 68px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 10px; line-height: 1.6; color: rgba(199,232,74,0.45); letter-spacing: 0.06em; background: rgba(199,232,74,0.04); border: 1px dashed rgba(199,232,74,0.20); border-radius: 4px; padding: 6px 14px; }
  .le-engine-card .static-mock .metric { color: rgba(199,232,74,0.45); font-weight: 700; font-size: 20px; letter-spacing: -0.02em; margin-right: 12px; font-family: var(--sans); }


  /* ========= Hero ========= */
  .le-hero { position: relative; padding: 64px 56px 100px; min-height: 1100px; overflow: hidden; }
  @media (max-width: 900px) { .le-hero { padding: 40px 20px 56px; min-height: auto; } }
  .le-hero-canvas { position: absolute; inset: 0; width: 100%; height: 1100px; opacity: 0.55; pointer-events: none; }
  .le-hero-mesh-svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.5; pointer-events: none; }
  .le-hero-content { position: relative; z-index: 2; max-width: 1320px; margin: 0 auto; }
  .le-hero-eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; color: var(--accent); margin-bottom: 28px; display: flex; align-items: center; gap: 14px; }
  .le-hero-eyebrow .dot { display: inline-block; width: 8px; height: 8px; background: var(--accent); border-radius: 99px; }

  .le-hero-trust-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--accent); margin: 24px 0 12px; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--accent-line); border-radius: 999px; background: var(--accent-soft); align-self: flex-start; }

  .le-hero-title { font-family: var(--zh); font-size: clamp(40px, 5.4vw, 84px); line-height: 1.18; margin: 0 0 36px; letter-spacing: -0.03em; font-weight: 800; position: relative; max-width: 1080px; word-break: keep-all; text-wrap: balance; }
  .le-hero-title > span { display: block; }
  .le-hero-title .le-grad { display: inline; }
  .le-hero-title .sub { display: block; font-size: 0.62em; color: var(--text-2); font-weight: 700; margin-top: 14px; line-height: 1.3; }
  @media (max-width: 1200px) { .le-hero-title { font-size: clamp(40px, 5.4vw, 64px); max-width: 880px; } }
  @media (max-width: 900px) { .le-hero-title { font-size: 36px; line-height: 1.22; margin-bottom: 20px; max-width: 100%; } .le-hero-title .sub { font-size: 0.7em; margin-top: 10px; } }

  .le-hero-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 80px; margin-bottom: 64px; }
  @media (max-width: 900px) { .le-hero-grid { grid-template-columns: 1fr; gap: 28px; margin-bottom: 28px; } }

  .le-hero-blurb { font-family: var(--zh); font-size: 24px; line-height: 1.55; color: var(--text-2); max-width: 780px; }
  .le-hero-blurb b { color: var(--text); font-weight: 700; }
  @media (max-width: 900px) { .le-hero-blurb { font-size: 14px; line-height: 1.6; } }

  .le-hero-cta-col { display: flex; flex-direction: column; gap: 14px; align-self: end; }
  /* v0.4.9 wave 6 · Filter Funnel SVG + keyframes 全砍（Edward 反饋 · 動態效果差）*/
  .le-cta-primary { background: var(--accent); color: var(--bg); border: 0; padding: 22px 26px; font-family: var(--mono); font-size: 14px; font-weight: 800; letter-spacing: 0.1em; cursor: pointer; display: flex; justify-content: space-between; align-items: center; text-decoration: none; min-height: 60px; }
  .le-cta-secondary { background: transparent; color: var(--text); border: 1px solid var(--text-2); padding: 21px 26px; font-family: var(--mono); font-size: 14px; font-weight: 700; letter-spacing: 0.1em; cursor: pointer; display: flex; justify-content: space-between; align-items: center; text-decoration: none; min-height: 60px; transition: border-color 160ms, background 160ms; }
  .le-cta-secondary:hover { border-color: var(--accent); background: var(--accent-soft); }
  .le-cta-secondary .sub { font-size: 11px; color: var(--muted); }
  @media (max-width: 900px) { .le-cta-primary, .le-cta-secondary { padding: 16px 18px; font-size: 12px; min-height: 48px; } }

  .le-stream { padding: 18px 22px; display: flex; align-items: center; gap: 18px; margin-bottom: 24px; background: var(--surface); border: 1px solid var(--line); flex-wrap: wrap; }
  .le-stream .label { font-family: var(--mono); font-size: 10px; color: var(--accent-dim); letter-spacing: 0.18em; flex: 0 0 auto; }
  .le-stream .tokens { font-family: var(--mono); font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 0; }
  .le-stream .meta { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  @media (max-width: 900px) { .le-stream { padding: 12px 14px; flex-direction: column; align-items: flex-start; gap: 8px; } .le-stream .tokens { font-size: 11px; } .le-stream .meta { display: none; } }

  .le-telemetry { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border: 1px solid var(--line); }
  .le-telemetry .cell { padding: 22px 24px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .le-telemetry .cell:last-child { border-right: 0; }
  .le-telemetry .v { font-family: var(--sans); font-weight: 800; font-size: 46px; line-height: 1; letter-spacing: -0.04em; }
  .le-telemetry .l { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  @media (max-width: 900px) { .le-telemetry { grid-template-columns: repeat(2, 1fr); } .le-telemetry .cell { padding: 14px 12px; gap: 4px; } .le-telemetry .cell:nth-child(2) { border-right: 0; } .le-telemetry .cell:nth-child(1), .le-telemetry .cell:nth-child(2) { border-bottom: 1px solid var(--line); } .le-telemetry .v { font-size: 28px; } }

  /* === Telemetry LIVE/TARGET badge === */
  .le-telemetry .cell { position: relative; }
  .le-telemetry .badge { position: absolute; top: 10px; right: 12px; font-family: var(--mono); font-size: 9px; letter-spacing: 0.18em; padding: 3px 6px; border-radius: 2px; font-weight: 700; }
  .le-telemetry .badge.live { color: var(--accent); background: rgba(199,232,74,0.10); border: 1px solid rgba(199,232,74,0.4); }
  .le-telemetry .badge.target { color: var(--muted); background: transparent; border: 1px solid var(--line); }
  @media (max-width: 900px) { .le-telemetry .badge { top: 6px; right: 8px; font-size: 8px; padding: 2px 4px; letter-spacing: 0.12em; } }

  /* === E POC Tracker === */
  .le-poc { margin-top: 28px; padding: 28px 30px; border: 1px solid var(--line); background: rgba(199,232,74,0.02); position: relative; }
  .le-poc-h { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .le-poc-h .ttl { font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; color: var(--accent); font-weight: 700; }
  .le-poc-h .target { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; color: var(--muted); }
  .le-poc-rows { display: grid; grid-template-columns: 1fr; gap: 18px; }
  .le-poc-row { display: grid; grid-template-columns: 1.4fr 1fr 110px; gap: 18px; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--line-soft); }
  .le-poc-row:last-child { border-bottom: 0; }
  .le-poc-row .label { font-family: var(--zh); font-size: 14px; color: var(--text); font-weight: 500; }
  .le-poc-row .label .sub { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.14em; margin-left: 8px; text-transform: uppercase; }
  .le-poc-row .bar { height: 6px; background: rgba(255,255,255,0.04); border: 1px solid var(--line); position: relative; overflow: hidden; }
  .le-poc-row .bar .fill { height: 100%; background: var(--accent); width: 0%; transition: width 600ms ease; }
  .le-poc-row .bar .fill.zero { background: var(--muted); width: 4%; opacity: 0.3; }
  .le-poc-row .stat { font-family: var(--mono); font-size: 12px; color: var(--accent); font-weight: 700; text-align: right; letter-spacing: 0.04em; }
  .le-poc-row .stat.pending { color: var(--muted); }
  @media (max-width: 900px) { .le-poc { padding: 20px 16px; } .le-poc-row { grid-template-columns: 1fr 100px; gap: 12px; } .le-poc-row .bar { grid-column: 1 / -1; } .le-poc-row .label { font-size: 13px; } .le-poc-row .label .sub { display: block; margin-left: 0; margin-top: 2px; } }

  /* ========= Section common ========= */
  .le-section { padding: 144px 56px; border-top: 1px solid var(--line); position: relative; overflow: hidden; }
  .le-section .inner { max-width: 1320px; margin: 0 auto; position: relative; }
  @media (max-width: 1100px) { .le-section { padding: 88px 32px; } }
  @media (max-width: 900px) { .le-section { padding: 64px 20px; } }

// v0.3 NeuralMesh degraded - static SVG 18 pts (was 49 pts canvas)
function NeuralMesh() {
  const pts = useMemo(() => {
    const seed = [
      [0.08, 0.18], [0.18, 0.32], [0.27, 0.12], [0.36, 0.42],
      [0.48, 0.22], [0.58, 0.38], [0.68, 0.16], [0.78, 0.32],
      [0.88, 0.20], [0.12, 0.62], [0.22, 0.78], [0.32, 0.58],
      [0.44, 0.72], [0.56, 0.62], [0.66, 0.82], [0.76, 0.66],
      [0.86, 0.78], [0.50, 0.92]
    ];
    return seed.map(([x, y], i) => ({ x: x * 1440, y: y * 800, r: 1.2 + (i % 3) * 0.5 }));
  }, []);
  const lines = useMemo(() => {
    const out = [];
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y, d = Math.sqrt(dx * dx + dy * dy);
      if (d < 280) out.push({ a: i, b: j });
    }
    return out;
  }, [pts]);
  return (
    <svg className="le-hero-mesh-svg" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <radialGradient id="meshGlowA" cx="70%" cy="20%" r="50%">
          <stop offset="0%" stopColor="rgba(199,232,74,0.10)" />
          <stop offset="100%" stopColor="rgba(199,232,74,0)" />
        </radialGradient>
        <radialGradient id="meshGlowB" cx="20%" cy="80%" r="50%">
          <stop offset="0%" stopColor="rgba(199,232,74,0.06)" />
          <stop offset="100%" stopColor="rgba(199,232,74,0)" />
        </radialGradient>
      </defs>
      <rect width="1440" height="800" fill="url(#meshGlowA)" />
      <rect width="1440" height="800" fill="url(#meshGlowB)" />
      {lines.map((l, i) => (
        <line key={"l" + i} x1={pts[l.a].x} y1={pts[l.a].y} x2={pts[l.b].x} y2={pts[l.b].y}
              stroke="rgba(199,232,74,0.16)" strokeWidth="0.6" />
      ))}
      {pts.map((p, i) => (
        <circle key={"p" + i} cx={p.x} cy={p.y} r={p.r}
                fill={i % 5 === 0 ? "rgba(199,232,74,0.85)" : "rgba(199,232,74,0.5)"} />
      ))}
    </svg>
  );
}

// EngineMock · 6 canvas types · chartreuse only
function EngineMock({ kind }) {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const ctx = c.getContext("2d");
    const W = c.width = 320, H = c.height = 90;
    let raf, t = 0;
    const draw = () => {
      ctx.clearRect(0, 0, W, H);
      t += 0.02;
      if (kind === "BriefMock") {
        for (let i = 0; i < 14; i++) {
          const w = 8 + Math.abs(Math.sin(t * 1.4 + i * 0.6)) * 32;
          ctx.fillStyle = i < 6
            ? "rgba(199,232,74," + (0.25 + 0.5 * Math.sin(t + i)) + ")"
            : "rgba(199,232,74,0.14)";
          ctx.fillRect(i * 22, H - w, 14, w);
        }
      } else if (kind === "MatchMock") {
        const cx = W / 2, cy = H / 2;
        ctx.strokeStyle = "rgba(199,232,74,0.4)"; ctx.lineWidth = 0.6;
        for (let i = 0; i < 6; i++) {
          const a = i / 6 * Math.PI * 2 + t * 0.4;
          const r = 32 + 4 * Math.sin(t * 2 + i);
          ctx.beginPath(); ctx.moveTo(cx, cy);
          ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.stroke();
          ctx.fillStyle = i === 0 ? "rgba(199,232,74,1)" : "rgba(199,232,74,0.55)";
          ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 3, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = "rgba(232,232,234,0.9)";
        ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();
      } else if (kind === "ContractMock") {
        ctx.strokeStyle = "rgba(199,232,74,0.5)"; ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x < W; x++) {
          const y = H / 2 + Math.sin((x + t * 40) * 0.04) * 14 * Math.sin((x + t * 20) * 0.012);
          if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.fillStyle = "rgba(199,232,74,0.85)"; ctx.fillRect(W - 30, 8, 22, 22);
        ctx.fillStyle = "#0a0a0b"; ctx.font = "bold 11px monospace";
        ctx.fillText("30%", W - 28, 22);
      } else if (kind === "DashMock") {
        for (let i = 0; i < 5; i++) {
          const fill = i < 1 + Math.floor(t * 0.6 % 5);
          ctx.fillStyle = fill ? "rgba(199,232,74,1)" : "#222";
          ctx.fillRect(i * 60 + 8, 30, 50, 30);
          ctx.fillStyle = fill ? "#0a0a0b" : "rgba(122,122,130,1)";
          ctx.font = "bold 10px monospace";
          ctx.fillText("M" + (i + 1), i * 60 + 22, 49);
        }
      } else if (kind === "NPSMock") {
        const cx = W / 2, cy = H + 20, r = 64;
        ctx.lineWidth = 8;
        ctx.strokeStyle = "#1a1a1a";
        ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 0); ctx.stroke();
        const v = 0.55 + 0.15 * Math.sin(t);
        ctx.strokeStyle = "rgba(199,232,74,1)";
        ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, Math.PI + Math.PI * v); ctx.stroke();
        ctx.fillStyle = "rgba(232,232,234,1)"; ctx.font = "bold 18px sans-serif";
        ctx.fillText(Math.floor(v * 100), cx - 12, cy - 12);
      } else if (kind === "RetainerMock") {
        for (let i = 0; i < 6; i++) {
          const o = (i + t * 0.3) % 6;
          ctx.fillStyle = "rgba(199,232,74," + (0.15 + (5 - o) / 15) + ")";
          ctx.fillRect(i * 48 + 10, 20, 38, 50);
          ctx.fillStyle = "rgba(122,122,130,1)"; ctx.font = "9px monospace";
          ctx.fillText("M" + (i + 1), i * 48 + 20, 80);
        }
      }
      raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
    return () => cancelAnimationFrame(raf);
  }, [kind]);
  return <canvas ref={ref} />;
}

// v0.3 sticky nav scrolled state + back-to-top fade-in
(function () {
  let throttleTimer = null;
  let lastScroll = 0;
  let ticking = false;
  function update() {
    const y = lastScroll;
    const nav = document.querySelector(".le-nav");
    const totop = document.querySelector(".le-totop");
    const threshold = window.innerHeight;
    if (nav) nav.classList.toggle("scrolled", y > threshold);
    if (totop) totop.classList.toggle("visible", y > threshold);
    ticking = false;
  }
  function onScroll() {
    lastScroll = window.scrollY || window.pageYOffset || 0;
    if (!ticking) {
      window.requestAnimationFrame(update);
      ticking = true;
    }
  }
  window.addEventListener("scroll", function () {
    if (throttleTimer) return;
    throttleTimer = setTimeout(function () { onScroll(); throttleTimer = null; }, 200);
    onScroll();
  }, { passive: true });

  function mountToTop() {
    if (document.querySelector(".le-totop")) return;
    const btn = document.createElement("button");
    btn.className = "le-totop";
    btn.setAttribute("aria-label", "回到頂部");
    btn.innerHTML = "↑";
    btn.addEventListener("click", function () {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    document.body.appendChild(btn);
  }
  setTimeout(mountToTop, 600);
})();
</script>
